<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>caucel — look & feel</title>
  <meta name="description" content="Listen to Look & Feel by Caucel on all streaming platforms.">
  <meta property="og:title" content="caucel — look & feel">
  <meta property="og:description" content="New single out now. Listen on Spotify, Apple Music, YouTube, Tidal, Amazon Music, SoundCloud and Bandcamp.">
  <meta property="og:image" content="cover.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #f5e800;
      --yellow-dim: rgba(245, 232, 0, 0.08);
      --bg: #080808;
      --surface: #101010;
      --surface2: #0d0d0d;
      --border: #1e1e1e;
      --text-primary: #f0f0f0;
      --text-secondary: #5a5a5a;
      --text-muted: #2e2e2e;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
    }

    /* grain overlay */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    /* subtle yellow glow behind card */
    .glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245,232,0,0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* TOP BANNER */
    .banner {
      background: var(--yellow);
      padding: 9px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .banner-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #000;
      animation: blink 1.4s ease-in-out infinite;
    }

    .banner-dot:nth-child(3) { animation-delay: 0.2s; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .banner-text {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      color: #000;
      text-transform: uppercase;
    }

    /* HERO */
    .hero {
      display: flex;
      align-items: flex-end;
      gap: 24px;
      padding: 32px 36px 26px;
      border-bottom: 0.5px solid var(--border);
    }

    .cover-wrap {
      flex-shrink: 0;
      width: 116px;
      height: 116px;
      border-radius: 8px;
      overflow: hidden;
      border: 0.5px solid var(--border);
      position: relative;
    }

    .cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .meta { flex: 1; min-width: 0; }

    .tag {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.16em;
      color: var(--yellow);
      text-transform: uppercase;
      margin-bottom: 9px;
    }

    .title {
      font-family: 'DM Sans', sans-serif;
      font-size: 30px;
      font-weight: 300;
      color: var(--text-primary);
      line-height: 1.0;
      letter-spacing: -0.025em;
      margin-bottom: 6px;
    }

    .artist {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 300;
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      margin-bottom: 14px;
    }

    .release-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--yellow-dim);
      border: 0.5px solid rgba(245,232,0,0.2);
      border-radius: 100px;
      padding: 3px 9px;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--yellow);
      text-transform: uppercase;
    }

    .pill-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--yellow);
      animation: blink 1.4s ease-in-out infinite;
    }

    .duration {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      color: var(--text-secondary);
      letter-spacing: 0.06em;
    }

    /* CTA TEXT */
    .cta-section {
      padding: 22px 36px 0;
    }

    .cta-headline {
      font-size: 15px;
      font-weight: 400;
      color: var(--text-primary);
      line-height: 1.5;
      margin-bottom: 4px;
    }

    .cta-sub {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 300;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
      line-height: 1.6;
    }

    /* PLATFORMS */
    .platforms {
      padding: 20px 36px 32px;
    }

    .section-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.18em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: 9px;
      padding: 12px 14px;
      text-decoration: none;
      color: #999;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--yellow);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .btn:hover {
      border-color: rgba(245,232,0,0.5);
      color: #fff;
      background: #131313;
      transform: translateY(-1px);
    }

    .btn:active { transform: translateY(0); }
    .btn:hover::after { opacity: 0.03; }
    .btn:hover .arrow { opacity: 1; transform: translate(0, 0); }
    .btn:hover .dot { opacity: 0; }

    .btn-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .btn-label {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .btn-right {
      position: relative;
      width: 12px;
      height: 12px;
      flex-shrink: 0;
    }

    .dot {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #2a2a2a;
      transition: opacity 0.15s;
    }

    .arrow {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 10px;
      height: 10px;
      opacity: 0;
      transform: translate(-3px, 3px);
      transition: opacity 0.18s, transform 0.18s;
      color: var(--yellow);
      z-index: 1;
    }

    /* DIVIDER */
    .divider {
      height: 0.5px;
      background: var(--border);
      margin: 0 36px;
    }

    /* FOOTER */
    .footer {
      padding: 18px 36px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .footer-text {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .footer-divider {
      flex: 1;
      height: 0.5px;
      background: var(--border);
    }

    .social-link {
      display: flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      color: var(--text-secondary);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 0.18s;
      white-space: nowrap;
      padding: 6px 10px;
      border: 0.5px solid var(--border);
      border-radius: 100px;
      background: var(--surface2);
    }

    .social-link:hover {
      color: var(--yellow);
      border-color: rgba(245,232,0,0.3);
    }

    .social-link svg {
      width: 11px;
      height: 11px;
    }

    @media (max-width: 480px) {
      body { padding: 24px 16px; }
      .hero { padding: 26px 24px 22px; gap: 16px; }
      .cover-wrap { width: 90px; height: 90px; }
      .title { font-size: 24px; }
      .cta-section { padding: 18px 24px 0; }
      .platforms { padding: 16px 24px 28px; }
      .divider { margin: 0 24px; }
      .footer { padding: 16px 24px 22px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
